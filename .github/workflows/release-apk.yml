name: Release APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create local environment file
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cp .env.example .env
          if [ -n "$GEMINI_API_KEY" ]; then
            sed -i "s/^GEMINI_API_KEY=.*/GEMINI_API_KEY=$GEMINI_API_KEY/" .env
          fi

      - name: Recreate google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON_BASE64 não configurado. Build do Android requer google-services.json."
            exit 1
          fi
          clean=$(echo "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]')
          echo "Diagnóstico (não sensível): tamanho do secret bruto=${#GOOGLE_SERVICES_JSON_BASE64} chars, limpo=${#clean} chars, resto na divisão por 4=$(( ${#clean} % 4 ))"
          echo "$clean" | base64 -d --ignore-garbage > android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Locate built APK
        id: apk
        run: |
          apk_path=$(find build/app/outputs -type f -name "*.apk" | head -n 1)
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          body: |
            Automated test build of CírioApp. This APK is not a Play Store production release.
